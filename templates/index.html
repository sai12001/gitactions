<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simple-cicd-app</title>
  <style>
    :root {
      --bg: #0e1412;
      --panel: #17211d;
      --line: #2a3a33;
      --text: #e7f0eb;
      --muted: #8ea399;
      --accent: #3dbe8c;
      --accent-dim: #1c4a38;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 10% -10%, #1c3a2e 0%, transparent 60%),
        var(--bg);
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.ok { background: var(--accent); }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 28px 24px;
      margin-bottom: 16px;
    }

    .label {
      margin: 0 0 10px;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .message {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
      line-height: 1.35;
      font-weight: 560;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px;
    }

    .deploy-name {
      margin: 0 0 18px;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .pipeline {
      display: flex;
      align-items: center;
      gap: 0;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .pipeline li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text);
    }

    .pipeline li::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-dim);
      flex: none;
    }

    .pipeline li:not(:last-child)::after {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--accent);
      margin-right: 8px;
    }

    .version {
      margin: 8px 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -0.03em;
      word-break: break-all;
      color: var(--accent);
    }

    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .error {
      color: #f0b429;
    }

    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      .pipeline { flex-wrap: wrap; row-gap: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>simple-cicd-app</h1>
      <span class="live"><span class="dot" id="health-dot"></span><span id="health-text">checking</span></span>
    </header>

    <section class="hero">
      <p class="label">Message</p>
      <p class="message" id="message">Loading…</p>
    </section>

    <div class="grid">
      <section class="card">
        <p class="label">Deployment</p>
        <p class="deploy-name" id="deployment">—</p>
        <ol class="pipeline" aria-label="Deploy pipeline">
          <li>Build</li>
          <li>Push</li>
          <li>Deploy</li>
        </ol>
      </section>

      <section class="card">
        <p class="label">Version</p>
        <p class="version" id="version">—</p>
        <p class="hint">Image tag from this deploy</p>
      </section>
    </div>
  </main>

  <script>
    async function loadStatus() {
      const message = document.getElementById("message");
      const deployment = document.getElementById("deployment");
      const version = document.getElementById("version");
      const dot = document.getElementById("health-dot");
      const healthText = document.getElementById("health-text");

      try {
        const [statusRes, healthRes] = await Promise.all([
          fetch("/api"),
          fetch("/health"),
        ]);
        if (!statusRes.ok) throw new Error("status " + statusRes.status);
        const data = await statusRes.json();
        message.textContent = data.message || "—";
        deployment.textContent = data.deployment || "—";
        version.textContent = data.version || "—";
        version.title = data.version || "";

        if (healthRes.ok) {
          dot.classList.add("ok");
          healthText.textContent = "healthy";
        } else {
          healthText.textContent = "unhealthy";
        }
      } catch (err) {
        message.textContent = "Could not load status.";
        message.classList.add("error");
        healthText.textContent = "unreachable";
      }
    }

    loadStatus();
  </script>
</body>
</html>
